[package]
name = "app"
version = "0.1.0"
description = "STEAM Rural - Sumapaz: software educativo para talleres de robótica creativa"
authors = ["Gaddiel Esteban Nieto Rojas", "Juan David Zacipa Garcia"]
license = ""
repository = "https://github.com/esteban-nieto/steam-rural"
edition = "2024"
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "3.0.0-alpha.5", features = [] }
tauri-runtime-wry = { version = "3.0.0-alpha.5" }
tauri-plugin-log = "3.0.0-alpha.1"
local-ip-address = "0.6.13"
